apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jax-scale-job
  namespace: default
spec:
  failurePolicy:
    maxRestarts: 2
  network:
    enableDNSHostnames: true
    subdomain: jax-scale-job
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 20
          completions: 20
          backoffLimit: 0
          completionMode: Indexed
          template:
            metadata:
              labels:
                jobset.x-k8s.io/jobset-name: jax-scale-job
            spec:
              subdomain: jax-scale-job
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchExpressions:
                          - key: jobset.x-k8s.io/jobset-name
                            operator: In
                            values: ["jax-scale-job"]
                      topologyKey: "kubernetes.io/hostname"
              nodeSelector:
                cloud.google.com/gke-nodepool: default-pool
              restartPolicy: Never
              containers:
                - name: jax-cpu-worker
                  image: us-central1-docker.pkg.dev/multinode-gke-dev-test/jax-gke-repo/jax-cpu-multinode:latest
                  ports:
                    - containerPort: 1234
                      name: coordinator
                  env:
                    - name: JOB_COMPLETION_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    - name: XLA_FLAGS
                      value: "--xla_force_host_platform_device_count=4"
                    - name: NUM_PROCESSES
                      value: "20"
                    - name: PROCESS_ID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    - name: COORDINATOR_ADDRESS
                      value: "jax-scale-job-workers-0-0.jax-scale-job.default.svc.cluster.local:1234"
                  resources:
                    requests:
                      cpu: "1500m"
                      memory: "2Gi"
                    limits:
                      cpu: "2"
                      memory: "4Gi"
